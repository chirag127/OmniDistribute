name: OmniDistribute CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build (Node.js/TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Run tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
